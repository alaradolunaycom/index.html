# ---- Search strategy -------------------------------------------------------
# Primary lane = roles where "strategy + hands-on execution at an early-stage B2B
# company" is the job. Everything else is a distraction.
search:
  title_include:            # at least one must match the job title (case-insensitive)
    - growth
    - go-to-market
    - gtm
    - demand gen
    - demand generation
    - performance marketing
    - marketing manager
    - marketing lead
    - head of marketing
    - founding marketer
    - product marketing
    - b2b marketing
    - digital marketing manager
    - lifecycle marketing
    - marketing operations
    - partnerships manager
  title_exclude:
    - intern
    - internship
    - junior
    - graduate
    - engineer
    - developer
    - designer
    - data scientist
    - account executive
    - sdr
    - bdr
    - recruiter
    - chief
    - vp
    - vice president
  # Locations that are OK for a person based in Türkiye.
  location_ok:
    - turkey
    - türkiye
    - turkiye
    - istanbul
    - ankara
    - izmir
    - eskişehir
    - eskisehir
    - emea
    - europe
    - worldwide
    - anywhere
    - global
    - remote
    - mena
    - middle east
    - utc+3
    - cet
  location_foreign:         # "Remote - <one of these>" is rejected unless a target region is also named
    - us
    - usa
    - u.s.
    - united states
    - canada
    - north america
    - americas
    - latam
    - brazil
    - mexico
    - india
    - apac
    - australia
    - singapore
    - philippines
    - new york
    - san francisco
  location_block:           # remote-but-restricted phrases
    - us only
    - usa only
    - united states only
    - us-based
    - must be based in the us
    - north america only
    - canada only
    - americas only
    - latam only
    - apac only
    - us citizens
    - security clearance
  keyword_weights:          # description keywords → points (fit signal)
    b2b: 6
    saas: 6
    fintech: 6
    insurtech: 5
    hubspot: 6
    go-to-market: 5
    gtm: 5
    early-stage: 4
    seed: 3
    series a: 4
    series b: 2
    abm: 4
    account-based: 4
    linkedin: 3
    demand generation: 4
    pipeline: 3
    positioning: 4
    market entry: 5
    expansion: 2
    turkish: 8
    türkiye: 6
    turkey: 6
    emea: 3
    founder: 3
    fractional: 3
    mixpanel: 3
    sql: 2
    performance marketing: 4
    google ads: 2
    meta ads: 2
  shortlist_min_rule_score: 35
  max_llm_reviews_per_run: 25
  max_age_days: 21

# LinkedIn searches you open yourself (the agent builds the URLs; it does not log in).
linkedin:
  keywords:
    - "Growth Marketing Manager"
    - "Head of Growth"
    - "GTM Manager"
    - "Demand Generation Manager"
    - "Product Marketing Manager B2B SaaS"
    - "Founding Marketer"
    - "Performance Marketing Manager"
  locations: ["Turkey", "European Union", "United Kingdom", "EMEA"]
  remote_only: true
  posted_within_hours: 24

# Public ATS boards (Greenhouse / Lever / Ashby). Slugs are the part of the
# careers URL, e.g. boards.greenhouse.io/<slug>, jobs.lever.co/<slug>,
# jobs.ashbyhq.com/<slug>. Add companies from your target list; bad slugs are
# logged and skipped.
companies:
  greenhouse: []
  lever: []
  ashby: []

# Aggregators with public feeds.
aggregators:
  remotive_categories: [marketing, sales-business]
  remoteok_tags: [marketing, growth]
  weworkremotely_feeds:
    - https://weworkremotely.com/categories/remote-sales-and-marketing-jobs.rss

# Discipline guardrails — the agent refuses to draft beyond these per day.
limits:
  daily_applications: 10
  daily_outreach: 15
  followup_after_days: 5
  second_followup_after_days: 7
